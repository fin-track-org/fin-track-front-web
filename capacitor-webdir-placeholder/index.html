<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>게으른 가계부 — Capacitor 기술검증 플레이스홀더</title>
  </head>
  <body>
    <p>
      이 파일은 실제 앱 화면이 아니다. Capacitor CLI가 webDir에 index.html을 요구해 만든
      플레이스홀더이며, <code>capacitor.config.ts</code>의 <code>server.url</code>이 설정되면
      이 파일 대신 원격 테스트 서버를 로드한다(IMPLEMENTATION_BRIEF_006 §3).
      <code>server.url</code>이 비어 있을 때만(환경변수 미설정) 이 화면이 실제로 보인다.
    </p>
  </body>
</html>
